# ==============================================================================
# Local Jenkins controller for the ETP-testing pipeline.
#
#   cd infra/jenkins
#   docker compose up -d --build
#   docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
#   open http://localhost:8080
# ==============================================================================
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"   # Jenkins UI
      - "50000:50000" # inbound agent connections (unused for now, harmless to expose)
    volumes:
      - jenkins_home:/var/jenkins_home
      # Docker-outside-of-docker: Jenkins shells out to the HOST docker engine
      # instead of running its own nested daemon.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
